<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dadex – A Legacy of Excellence</title>
    <meta name="description" content="Dadex – Corporate Story Experience" />
    <meta name="theme-color" content="#D32F2F" />

    <!-- Preload critical images -->
    <link rel="preload" href="assets/images/dadex_logo.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="assets/images/f_chairman.jpg" as="image" type="image/jpeg" fetchpriority="high" />
    <link rel="preload" href="assets/images/map_pak.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="assets/images/manufacturing.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="assets/images/timeline.jpg" as="image" type="image/png" fetchpriority="high" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Poppins:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- External CSS -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <!-- Skip Link: now targets the slides track which is focusable -->
    <a href="#slidesTrack" class="skip-link">Skip to content</a>

    <!-- Loading Screen -->
    <div id="loading-screen" role="status" aria-live="polite">
        <div class="loader"></div>
        <p>Loading Dadex Presentation…</p>
    </div>

    <!-- Ambient Blobs -->
    <div class="blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- Deck -->
    <div id="deck" class="deck">
        <div class="slides-wrapper" id="slidesWrapper">
            <!-- Make the track focusable for skip link -->
            <div class="slides-track" id="slidesTrack" tabindex="-1" role="region" aria-label="Presentation slides"></div>

            <div class="deck-footer" id="deckFooter">
                <div class="footer-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Slide progress">
                    <div class="footer-progress-fill" id="progressFill"></div>
                </div>
                <div class="footer-logo">
                    <img src="assets/images/dadex_logo.png" alt="Dadex Logo" width="120" height="40" decoding="async" />
                </div>
            </div>

            <nav class="deck-nav" id="deckNav" aria-label="Presentation navigation">
                <div class="nav-group">
                    <button id="homeBtn" class="nav-btn" aria-label="First slide" title="First slide (Home)"><i class="fas fa-home"></i></button>
                    <button id="playBtn" class="nav-btn nav-btn-primary" aria-label="Start playback" title="Play (Space)"><i class="fas fa-play"></i></button>
                    <button id="pauseBtn" class="nav-btn nav-btn-primary" aria-label="Pause playback" title="Pause (Space)" hidden><i class="fas fa-pause"></i></button>
                    <button id="stopBtn" class="nav-btn" aria-label="Stop playback" title="Stop"><i class="fas fa-stop"></i></button>
                    <div class="playback-status" id="playbackStatus" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span class="status-text">PAUSED</span></div>
                </div>

                <div class="nav-group">
                    <button id="prevBtn" class="nav-btn" aria-label="Previous slide" title="Previous (←)"><i class="fas fa-chevron-left"></i></button>
                    <span id="slideCounter">1 / 31</span>
                    <button id="nextBtn" class="nav-btn" aria-label="Next slide" title="Next (→)"><i class="fas fa-chevron-right"></i></button>
                </div>

                <div class="nav-group">
                    <button id="fullscreenBtn" class="nav-btn" aria-label="Toggle fullscreen" title="Fullscreen (F)"><i class="fas fa-expand"></i></button>
                    <button id="loopToggle" class="nav-btn" aria-label="Toggle loop" aria-pressed="false" title="Loop (L)"><i class="fas fa-repeat"></i></button>
                    <button id="helpBtn" class="nav-btn" aria-label="Open keyboard help" title="Help (?)"><i class="fas fa-question-circle"></i></button>
                </div>
            </nav>
        </div>
    </div>

    <!-- Help Overlay -->
    <div class="overlay" id="helpOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Keyboard shortcuts help">
        <div class="overlay-content">
            <button class="overlay-close" id="helpClose" aria-label="Close help">&times;</button>
            <h2>⌨️ Keyboard Shortcuts</h2>
            <div class="help-grid">
                <div class="help-item"><kbd>→</kbd> <span>Next slide</span></div>
                <div class="help-item"><kbd>←</kbd> <span>Previous slide</span></div>
                <div class="help-item"><kbd>Space</kbd> <span>Play / Pause</span></div>
                <div class="help-item"><kbd>Home</kbd> <span>First slide</span></div>
                <div class="help-item"><kbd>End</kbd> <span>Last slide</span></div>
                <div class="help-item"><kbd>F</kbd> <span>Fullscreen</span></div>
                <div class="help-item"><kbd>L</kbd> <span>Toggle loop</span></div>
                <div class="help-item"><kbd>Esc</kbd> <span>Close help</span></div>
                <div class="help-item"><kbd>?</kbd> <span>Help</span></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Live Region -->
    <div id="slide-live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script src="js/slides.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
